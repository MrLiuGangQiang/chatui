name: Publish ChatUI release
run-name: Publish ChatUI ${{ inputs.version || github.ref_name }} to ACR

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: Release tag to publish, for example v1.2.39
        required: true
        type: string
      publish_dockerhub:
        description: Mirror the verified ACR image to Docker Hub
        required: false
        default: true
        type: boolean

concurrency:
  group: docker-release-${{ inputs.version || github.ref_name }}
  cancel-in-progress: false

env:
  IMAGE_NAME: chatui

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      semver: ${{ steps.canonical.outputs.semver }}
      git_sha: ${{ steps.identity.outputs.git_sha }}
      source_revision: ${{ steps.identity.outputs.source_revision }}
    steps:
      - name: Validate release version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          VERSION="${{ inputs.version || github.ref_name }}"
          if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tag must match vMAJOR.MINOR.PATCH, for example v1.0.0. Got: $VERSION" >&2
            exit 1
          fi

          SEMVER="${VERSION#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "semver=$SEMVER" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ steps.version.outputs.version }}
          fetch-depth: 0

      - name: Verify annotated tag belongs to main
        run: |
          git fetch origin main:refs/remotes/origin/main --force
          node scripts/verify-release-ref.js "${{ steps.version.outputs.version }}" origin/main

      - name: Resolve canonical version source
        id: canonical
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_VERSION="$(node -p "require('./scripts/version-source').readVersion()")"
          test "$SOURCE_VERSION" = "${{ steps.version.outputs.semver }}"
          echo "semver=$SOURCE_VERSION" >> "$GITHUB_OUTPUT"

      - name: Resolve immutable release identity
        id: identity
        shell: bash
        run: |
          set -euo pipefail
          echo "git_sha=$(git rev-list -n 1 '${{ steps.version.outputs.version }}')" >> "$GITHUB_OUTPUT"
          echo "source_revision=$(node scripts/runtime-identity.js --source-only)" >> "$GITHUB_OUTPUT"

      - name: Validate release metadata
        run: node scripts/verify-release.js "${{ steps.version.outputs.version }}"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run release checks
        run: npm run check

  build-acr-candidate:
    name: Build ACR candidate
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.validate.outputs.version }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Alibaba Cloud ACR
        uses: docker/login-action@v4
        with:
          registry: ${{ secrets.ACR_REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and push immutable ACR candidate
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          pull: true
          tags: |
            ${{ secrets.ACR_REGISTRY }}/${{ secrets.ACR_NAMESPACE }}/${{ env.IMAGE_NAME }}:candidate-${{ needs.validate.outputs.git_sha }}
          build-args: |
            CHATUI_VERSION=${{ needs.validate.outputs.semver }}
            CHATUI_BUILD_SHA=${{ needs.validate.outputs.git_sha }}
            CHATUI_SOURCE_REVISION=${{ needs.validate.outputs.source_revision }}
          cache-from: type=gha,scope=${{ env.IMAGE_NAME }}

  verify-acr-candidate:
    name: Verify ACR candidate runtime
    needs: [validate, build-acr-candidate]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout runtime verifier
        uses: actions/checkout@v5

      - name: Verify the exact ACR candidate digest
        run: >-
          node scripts/verify-image-runtime.js
          --image ${{ secrets.ACR_REGISTRY }}/${{ secrets.ACR_NAMESPACE }}/${{ env.IMAGE_NAME }}@${{ needs.build-acr-candidate.outputs.digest }}
          --version ${{ needs.validate.outputs.semver }}
          --git-sha ${{ needs.validate.outputs.git_sha }}
          --source-revision ${{ needs.validate.outputs.source_revision }}

  promote-acr-release:
    name: Promote verified ACR digest
    needs: [validate, build-acr-candidate, verify-acr-candidate]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Login to Alibaba Cloud ACR
        uses: docker/login-action@v4
        with:
          registry: ${{ secrets.ACR_REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Promote the verified ACR digest without rebuilding
        shell: bash
        env:
          DIGEST: ${{ needs.build-acr-candidate.outputs.digest }}
          VERSION: ${{ needs.validate.outputs.version }}
          SEMVER: ${{ needs.validate.outputs.semver }}
          ACR_REGISTRY: ${{ secrets.ACR_REGISTRY }}
          ACR_NAMESPACE: ${{ secrets.ACR_NAMESPACE }}
        run: |
          set -euo pipefail
          ACR_IMAGE="${ACR_REGISTRY}/${ACR_NAMESPACE}/${IMAGE_NAME}"
          docker buildx imagetools create \
            --tag "${ACR_IMAGE}:${SEMVER}" \
            --tag "${ACR_IMAGE}:${VERSION}" \
            --tag "${ACR_IMAGE}:latest" \
            "${ACR_IMAGE}@${DIGEST}"

  verify-acr-release:
    name: Verify ACR release tags
    needs: [validate, build-acr-candidate, promote-acr-release]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Login to Alibaba Cloud ACR
        uses: docker/login-action@v4
        with:
          registry: ${{ secrets.ACR_REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Verify all ACR release tags resolve to the candidate digest
        shell: bash
        env:
          DIGEST: ${{ needs.build-acr-candidate.outputs.digest }}
          VERSION: ${{ needs.validate.outputs.version }}
          SEMVER: ${{ needs.validate.outputs.semver }}
          ACR_REGISTRY: ${{ secrets.ACR_REGISTRY }}
          ACR_NAMESPACE: ${{ secrets.ACR_NAMESPACE }}
        run: |
          set -euo pipefail
          ACR_IMAGE="${ACR_REGISTRY}/${ACR_NAMESPACE}/${IMAGE_NAME}"
          verify_digest() {
            local ref="$1"
            local output=""
            for attempt in $(seq 1 12); do
              if output="$(docker buildx imagetools inspect "$ref" 2>&1)" && \
                 awk -v expected="$DIGEST" '$1 == "Digest:" && $2 == expected { found=1 } END { exit(found ? 0 : 1) }' <<<"$output"; then
                echo "Verified ${ref} -> ${DIGEST}"
                return 0
              fi
              if [[ "$attempt" -lt 12 ]]; then
                echo "Waiting for ${ref} to expose ${DIGEST} (${attempt}/12)"
                sleep 5
              fi
            done
            echo "$output" >&2
            echo "${ref} did not resolve to ${DIGEST} after registry propagation retries" >&2
            return 1
          }
          for ref in \
            "${ACR_IMAGE}:${SEMVER}" "${ACR_IMAGE}:${VERSION}" "${ACR_IMAGE}:latest"; do
            verify_digest "$ref"
          done

  github-release:
    name: Publish GitHub Release
    needs: [validate, verify-acr-release]
    if: github.event_name == 'push' || inputs.version != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Checkout release notes
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.validate.outputs.version }}

      - name: Create or update GitHub Release
        uses: actions/github-script@v9
        env:
          RELEASE_TAG: ${{ needs.validate.outputs.version }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const tag = process.env.RELEASE_TAG;
            const notesPath = `docs/releases/${tag}.md`;
            const body = require('fs').readFileSync(notesPath, 'utf8').trim();
            if (!body) throw new Error(`Release notes are empty: ${notesPath}`);
            const release = {
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: tag,
              name: `ChatUI ${tag}`,
              body,
              draft: false,
              prerelease: false,
            };
            try {
              const existing = await github.rest.repos.getReleaseByTag({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag,
              });
              await github.rest.repos.updateRelease({ ...release, release_id: existing.data.id });
              core.info(`Updated GitHub Release for ${tag}.`);
            } catch (error) {
              if (error.status !== 404) throw error;
              await github.rest.repos.createRelease(release);
              core.info(`Created GitHub Release for ${tag}.`);
            }

  sync-dockerhub:
    name: Mirror verified image to Docker Hub
    if: github.event_name == 'push' || inputs.publish_dockerhub
    needs: [validate, build-acr-candidate, verify-acr-release, github-release]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Copy the verified ACR digest to Docker Hub without rebuilding
        shell: bash
        env:
          DIGEST: ${{ needs.build-acr-candidate.outputs.digest }}
          VERSION: ${{ needs.validate.outputs.version }}
          SEMVER: ${{ needs.validate.outputs.semver }}
          ACR_REGISTRY: ${{ secrets.ACR_REGISTRY }}
          ACR_NAMESPACE: ${{ secrets.ACR_NAMESPACE }}
          DOCKERHUB_NAMESPACE: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          set -euo pipefail
          ACR_IMAGE="${ACR_REGISTRY}/${ACR_NAMESPACE}/${IMAGE_NAME}"
          DOCKERHUB_IMAGE="${DOCKERHUB_NAMESPACE}/${IMAGE_NAME}"
          docker buildx imagetools create \
            --tag "${DOCKERHUB_IMAGE}:${SEMVER}" \
            --tag "${DOCKERHUB_IMAGE}:${VERSION}" \
            --tag "${DOCKERHUB_IMAGE}:latest" \
            "${ACR_IMAGE}@${DIGEST}"

      - name: Verify all Docker Hub tags resolve to the ACR candidate digest
        shell: bash
        env:
          DIGEST: ${{ needs.build-acr-candidate.outputs.digest }}
          VERSION: ${{ needs.validate.outputs.version }}
          SEMVER: ${{ needs.validate.outputs.semver }}
          DOCKERHUB_NAMESPACE: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          set -euo pipefail
          DOCKERHUB_IMAGE="${DOCKERHUB_NAMESPACE}/${IMAGE_NAME}"
          for ref in "${DOCKERHUB_IMAGE}:${SEMVER}" "${DOCKERHUB_IMAGE}:${VERSION}" "${DOCKERHUB_IMAGE}:latest"; do
            output="$(docker buildx imagetools inspect "$ref")"
            awk -v expected="$DIGEST" '$1 == "Digest:" && $2 == expected { found=1 } END { exit(found ? 0 : 1) }' <<<"$output" || {
              echo "${ref} did not resolve to ${DIGEST}" >&2
              exit 1
            }
          done
