<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>ChatUI</title>
  <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
  <link rel="shortcut icon" href="./favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="./assets/chatui.bundle.css?v=1.3.163-changelog-cards" />
  <script>
    try {
      if (localStorage.getItem('openapi-chat-image-session-sidebar-collapsed-v1') === '1') {
        document.documentElement.classList.add('session-sidebar-collapsed-boot');
      }
    } catch {}
  </script>
</head>
<body class="app-booting">
  <div class="app shell-app">
    <aside id="sessionRail" class="session-rail" aria-label="收起后的会话栏">
      <button id="railExpandBtn" class="rail-icon-btn" type="button" title="展开会话栏" aria-label="展开会话栏">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>
      </button>
      <button id="railNewSessionBtn" class="rail-icon-btn" type="button" title="新会话" aria-label="新会话">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
      </button>
      <button id="railChatBtn" class="rail-icon-btn" type="button" title="会话" aria-label="会话">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5.5 6.5h13v8.2a2.8 2.8 0 0 1-2.8 2.8H10l-4.5 3v-3H5.2a2.7 2.7 0 0 1-2.7-2.7V9.5a3 3 0 0 1 3-3Z"/></svg>
      </button>
      <button id="railConfigBtn" class="rail-icon-btn rail-bottom" type="button" title="配置" aria-label="配置">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7Z"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.05.05a2.05 2.05 0 0 1-2.9 2.9l-.05-.05A1.7 1.7 0 0 0 15 19.4a1.7 1.7 0 0 0-1 .55V20a2 2 0 0 1-4 0v-.08a1.7 1.7 0 0 0-1-.55 1.7 1.7 0 0 0-1.87.34l-.05.05a2.05 2.05 0 0 1-2.9-2.9l.05-.05A1.7 1.7 0 0 0 4.6 15a1.7 1.7 0 0 0-.55-1H4a2 2 0 0 1 0-4h.08a1.7 1.7 0 0 0 .55-1 1.7 1.7 0 0 0-.34-1.87l-.05-.05a2.05 2.05 0 0 1 2.9-2.9l.05.05A1.7 1.7 0 0 0 9 4.6c.35-.14.68-.32 1-.55V4a2 2 0 0 1 4 0v.08c.32.23.65.41 1 .55a1.7 1.7 0 0 0 1.87-.34l.05-.05a2.05 2.05 0 0 1 2.9 2.9l-.05.05A1.7 1.7 0 0 0 19.4 9c.14.35.32.68.55 1H20a2 2 0 0 1 0 4h-.08c-.23.32-.41.65-.55 1Z"/></svg>
        <span class="rail-version-badge" data-app-version data-version-changelog role="button" tabindex="0" aria-label="查看更新日志">v--</span>
      </button>
    </aside>

    <aside id="sessionSidebar" class="session-sidebar" aria-label="会话">
      <div class="session-sidebar-head">
        <div class="session-brand">
          <strong>ChatUI</strong>
          <span>会话</span>
          <button id="collapseSessionsBtn" class="session-collapse-btn" type="button" title="收起会话栏" aria-label="收起会话栏">
            <svg class="collapse-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 6 9 12l6 6"/></svg>
            <svg class="mobile-settings-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7Z"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.05.05a2.05 2.05 0 0 1-2.9 2.9l-.05-.05A1.7 1.7 0 0 0 15 19.4a1.7 1.7 0 0 0-1 .55V20a2 2 0 0 1-4 0v-.08a1.7 1.7 0 0 0-1-.55 1.7 1.7 0 0 0-1.87.34l-.05.05a2.05 2.05 0 0 1-2.9-2.9l.05-.05A1.7 1.7 0 0 0 4.6 15a1.7 1.7 0 0 0-.55-1H4a2 2 0 0 1 0-4h.08a1.7 1.7 0 0 0 .55-1 1.7 1.7 0 0 0-.34-1.87l-.05-.05a2.05 2.05 0 0 1 2.9-2.9l.05.05A1.7 1.7 0 0 0 9 4.6c.35-.14.68-.32 1-.55V4a2 2 0 0 1 4 0v.08c.32.23.65.41 1 .55a1.7 1.7 0 0 0 1.87-.34l.05-.05a2.05 2.05 0 0 1 2.9 2.9l-.05.05A1.7 1.7 0 0 0 19.4 9c.14.35.32.68.55 1H20a2 2 0 0 1 0 4h-.08c-.23.32-.41.65-.55 1Z"/></svg>
          </button>
        </div>
        <button id="newSessionBtn" class="session-new-btn" type="button" title="新会话" aria-label="新会话">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
          <span>新会话</span>
        </button>
      </div>
      <nav id="sessionList" class="session-list" aria-label="会话列表"></nav>

      <div class="session-bottom-actions">
        <div class="session-config-wrap">
        <button id="sidebarConfigBtn" class="session-config-btn" type="button" title="配置" aria-label="配置">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7Z"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.05.05a2.05 2.05 0 0 1-2.9 2.9l-.05-.05A1.7 1.7 0 0 0 15 19.4a1.7 1.7 0 0 0-1 .55V20a2 2 0 0 1-4 0v-.08a1.7 1.7 0 0 0-1-.55 1.7 1.7 0 0 0-1.87.34l-.05.05a2.05 2.05 0 0 1-2.9-2.9l.05-.05A1.7 1.7 0 0 0 4.6 15a1.7 1.7 0 0 0-.55-1H4a2 2 0 0 1 0-4h.08a1.7 1.7 0 0 0 .55-1 1.7 1.7 0 0 0-.34-1.87l-.05-.05a2.05 2.05 0 0 1 2.9-2.9l.05.05A1.7 1.7 0 0 0 9 4.6c.35-.14.68-.32 1-.55V4a2 2 0 0 1 4 0v.08c.32.23.65.41 1 .55a1.7 1.7 0 0 0 1.87-.34l.05-.05a2.05 2.05 0 0 1 2.9 2.9l-.05.05A1.7 1.7 0 0 0 19.4 9c.14.35.32.68.55 1H20a2 2 0 0 1 0 4h-.08c-.23.32-.41.65-.55 1Z"/></svg>
        </button>
        <button id="clearAllSessionsBtn" class="session-clear-all-btn" type="button" title="清除所有会话" aria-label="清除所有会话">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M6 7l1 13h10l1-13"/><path d="M9 7V4h6v3"/></svg>
        </button>
        <a class="session-github-btn" href="https://github.com/MrLiuGangQiang/chatui" target="_blank" rel="noopener noreferrer" title="GitHub 项目" aria-label="GitHub 项目">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.6A9.4 9.4 0 0 0 8.9 20c.47.09.64-.2.64-.45v-1.62c-2.6.57-3.15-1.12-3.15-1.12-.43-1.1-1.05-1.39-1.05-1.39-.86-.59.07-.58.07-.58.95.07 1.45.98 1.45.98.85 1.45 2.23 1.03 2.77.79.09-.62.33-1.03.6-1.27-2.08-.24-4.27-1.04-4.27-4.63 0-1.02.37-1.86.98-2.52-.1-.24-.43-1.2.09-2.48 0 0 .8-.26 2.61.96A9 9 0 0 1 12 6.35c.8 0 1.61.11 2.37.32 1.8-1.22 2.6-.96 2.6-.96.52 1.28.2 2.24.1 2.48.61.66.98 1.5.98 2.52 0 3.6-2.2 4.39-4.3 4.62.34.29.64.86.64 1.74v2.48c0 .25.17.54.65.45A9.4 9.4 0 0 0 12 2.6Z"/></svg>
        </a>
        <span class="sidebar-version-badge" data-app-version data-version-changelog role="button" tabindex="0" aria-label="查看更新日志" title="查看更新日志">
          <span class="sidebar-version-text">--</span>
        </span>
        </div>
      </div>
    </aside>
    <div id="sessionDrawerMask" class="session-drawer-mask" aria-hidden="true"></div>
    <button id="mobileSessionFloatBtn" class="mobile-session-float" type="button" title="会话列表" aria-label="会话列表">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
    </button>
    <main class="main">
      <nav id="historyAnchorNav" class="history-anchor-nav is-empty" aria-label="历史问题定位" aria-hidden="true"></nav>
      <section id="messages" class="messages"></section>

      <button id="resumeStreamBtn" class="resume-stream-btn" type="button" aria-label="回到正在输出" title="回到正在输出">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14"/><path d="m6 13 6 6 6-6"/></svg>
        <span>继续查看输出</span>
      </button>
      <form id="composer" class="composer compact-composer">
        <input id="fileInput" type="file" multiple class="visually-hidden-file-input" aria-label="选择附件" />
        <div class="input-stack">
          <div id="uploadProgress" class="upload-progress" aria-live="polite"></div>
          <div id="attachmentBar" class="attachment-bar"></div>
          <div id="quoteBar" class="quote-preview" hidden></div>
          <textarea id="prompt" rows="1" placeholder="输入消息，Enter 发送，Shift+Enter 换行"></textarea>
          <div class="composer-actions">
            <div class="composer-action-left">
              <button id="attachBtn" class="attach-btn" type="button" title="添加附件" aria-label="添加附件">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21.4 11.6 12 21a6 6 0 0 1-8.5-8.5L13.6 2.4a4.1 4.1 0 0 1 5.8 5.8L9.2 18.4a2.2 2.2 0 0 1-3.1-3.1l9.2-9.2"/></svg>
              </button>
              <button id="sessionPromptBtn" class="session-prompt-btn" type="button" title="会话提示词" aria-label="会话提示词">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3c-4 0-7 3-7 7 0 2.5 1.5 4.5 3.5 5.5L8 20l4-2 4 2-.5-4.5C17.5 14.5 19 12.5 19 10c0-4-3-7-7-7Zm0 3a1 1 0 0 1 1 1v3a1 1 0 0 1-2 0V7a1 1 0 0 1 1-1Zm0 8a1 1 0 1 1 0 2 1 1 0 0 1 0-2Z"/></svg>
              </button>
              <button id="sessionImageStyleBtn" class="session-prompt-btn session-image-style-btn" type="button" title="会话生图样式提示词" aria-label="会话生图样式提示词">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 17.5 9.5 12l3.2 3.2L16.5 11 20 14.5"/><path d="M5 5h14a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2Z"/><path d="M8.5 9.5h.01"/></svg>
              </button>
              <div class="session-model-control">
                <button id="sessionModelBtn" class="session-model-btn" type="button" title="会话聊天模型" aria-label="会话聊天模型" aria-expanded="false" aria-haspopup="menu">
                  <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="6" width="12" height="12" rx="3"/><path d="M9.5 10.5h5"/><path d="M9.5 13.5h3"/><path d="M9 2.5v2"/><path d="M15 2.5v2"/><path d="M9 19.5v2"/><path d="M15 19.5v2"/><path d="M2.5 9h2"/><path d="M2.5 15h2"/><path d="M19.5 9h2"/><path d="M19.5 15h2"/></svg>
                </button>
                <div id="sessionModelPanel" class="session-model-menu" role="menu" aria-hidden="true" aria-labelledby="sessionModelBtn"></div>
              </div>
              <div id="sessionPromptPanel" class="session-prompt-panel" role="dialog" aria-hidden="true" aria-labelledby="sessionPromptTitle">
                <div class="session-prompt-panel-head">
                  <div class="session-prompt-title-wrap">
                    <span id="sessionPromptTitle" class="session-prompt-panel-title">会话提示词</span>
                    <span class="session-prompt-panel-subtitle">只影响当前会话，保存后立即生效</span>
                  </div>
                  <span id="sessionPromptHint" class="session-prompt-hint-value session-prompt-none">无 · 未设置</span>
                </div>
                <label class="session-prompt-field">
                  <span class="session-prompt-field-row">
                    <span class="session-prompt-field-label">System Prompt</span>
                    <span class="session-prompt-inline-actions">
                      <button id="sessionPromptLoadGlobalBtn" class="session-prompt-ghost-btn" type="button">使用全局默认</button>
                      <button id="sessionPromptClearBtn" class="session-prompt-ghost-btn" type="button">清空</button>
                    </span>
                  </span>
                  <textarea id="sessionPromptInput" class="session-prompt-input" placeholder="留空保存，即表示当前会话不使用 system prompt。" rows="7"></textarea>
                </label>
                <div class="session-prompt-footer">
                  <button id="sessionPromptCancelBtn" class="session-prompt-secondary-btn" type="button">取消</button>
                  <button id="sessionPromptSaveBtn" class="session-prompt-primary-btn" type="button">保存</button>
                </div>
              </div>
              <div id="sessionImageStylePanel" class="session-prompt-panel session-image-style-panel" role="dialog" aria-hidden="true" aria-labelledby="sessionImageStyleTitle">
                <div class="session-prompt-panel-head">
                  <div class="session-prompt-title-wrap">
                    <span id="sessionImageStyleTitle" class="session-prompt-panel-title">会话生图样式提示词</span>
                    <span class="session-prompt-panel-subtitle">只影响当前会话的生图和编辑图片</span>
                  </div>
                  <span id="sessionImageStyleHint" class="session-prompt-hint-value session-prompt-none">无 · 未设置</span>
                </div>
                <label class="session-prompt-field">
                  <span class="session-prompt-field-row">
                    <span class="session-prompt-field-label">Image Style Prompt</span>
                    <span class="session-prompt-inline-actions">
                      <button id="sessionImageStyleLoadGlobalBtn" class="session-prompt-ghost-btn" type="button">使用全局默认</button>
                      <button id="sessionImageStyleClearBtn" class="session-prompt-ghost-btn" type="button">清空</button>
                    </span>
                  </span>
                  <textarea id="sessionImageStyleInput" class="session-prompt-input" placeholder="例如：写实摄影风格，柔和自然光，画面干净，高级质感。" rows="7"></textarea>
                </label>
                <div class="session-prompt-footer">
                  <button id="sessionImageStyleCancelBtn" class="session-prompt-secondary-btn" type="button">取消</button>
                  <button id="sessionImageStyleSaveBtn" class="session-prompt-primary-btn" type="button">保存</button>
                </div>
              </div>
              <div class="reasoning-control">
                <button id="reasoningToggle" class="reasoning-toggle" type="button" aria-pressed="false" title="开启思考模式" aria-label="开启思考模式">
                  <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M8.5 5.2A3.1 3.1 0 0 1 12 3a3.1 3.1 0 0 1 3.5 2.2 3.5 3.5 0 0 1 3 5.4 3.4 3.4 0 0 1-1.1 6.5 3.3 3.3 0 0 1-5.4 2.4 3.3 3.3 0 0 1-5.4-2.4 3.4 3.4 0 0 1-1.1-6.5 3.5 3.5 0 0 1 3-5.4Z"/>
                    <path d="M12 3v17"/>
                    <path d="M8.2 9.1c.9.1 1.6.5 2.1 1.2"/>
                    <path d="M15.8 9.1c-.9.1-1.6.5-2.1 1.2"/>
                    <path d="M8.3 14.6c.8-.1 1.5-.5 2-1.1"/>
                    <path d="M15.7 14.6c-.8-.1-1.5-.5-2-1.1"/>
                  </svg>
                </button>
                <div class="reasoning-popover-wrap">
                  <button id="reasoningMenuBtn" class="reasoning-menu-btn" type="button" aria-expanded="false" aria-haspopup="menu" title="&#x601D;&#x8003;&#x5F3A;&#x5EA6;">
                    <span id="reasoningTypeLabel">low</span>
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m7 10 5 5 5-5"/></svg>
                  </button>
                  <div id="reasoningMenu" class="reasoning-menu" role="menu" aria-hidden="true">
                    <div class="reasoning-menu-section">
                      <div class="reasoning-menu-title">&#x601D;&#x8003;&#x5F3A;&#x5EA6;</div>
                      <button class="reasoning-menu-item" type="button" data-reasoning-type="low" role="menuitemradio" aria-checked="false">low</button>
                      <button class="reasoning-menu-item" type="button" data-reasoning-type="medium" role="menuitemradio" aria-checked="false">medium</button>
                      <button class="reasoning-menu-item" type="button" data-reasoning-type="high" role="menuitemradio" aria-checked="false">high</button>
                      <button class="reasoning-menu-item" type="button" data-reasoning-type="xhigh" role="menuitemradio" aria-checked="false">xhigh</button>
                      <button class="reasoning-menu-item" type="button" data-reasoning-type="max" role="menuitemradio" aria-checked="false">max</button>
                    </div>
                  </div>
                </div>
              </div>
            </div>
            <button id="sendBtn" type="submit" aria-label="发送" title="发送">
              <svg class="send-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12 20 4l-5.2 16-3.1-6.7L4 12Z"/><path d="m11.7 13.3 4.1-4.1"/></svg>
              <svg class="stop-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="7" y="7" width="10" height="10" rx="2"/></svg>
            </button>
          </div>
        </div>
      </form>
    </main>
  </div>

  <div id="changelogModal" class="modal changelog-modal" aria-hidden="true">
    <div class="modal-mask" data-close-changelog></div>
    <section class="changelog-dialog" role="dialog" aria-modal="true" aria-labelledby="changelogTitle">
      <header class="dialog-head changelog-dialog-head">
        <div class="changelog-heading-copy">
          <span class="changelog-kicker"><span aria-hidden="true"></span>版本记录</span>
          <div class="changelog-title-row">
            <h2 id="changelogTitle">更新日志</h2>
            <button id="markAllChangelogReadBtn" class="changelog-mark-all-read" type="button" disabled>全部已读</button>
          </div>
          <p id="changelogSubtitle">按版本查看 ChatUI 的功能、修复与兼容性变化</p>
        </div>
        <button id="closeChangelogBtn" class="dialog-close" type="button" aria-label="关闭更新日志">×</button>
      </header>
      <div id="changelogContent" class="changelog-content" aria-live="polite">
        <p class="changelog-status">正在加载更新日志…</p>
      </div>
    </section>
  </div>

  <button id="supportedFilesFab" class="route-diagram-fab supported-files-fab" type="button" aria-label="查看支持的文件格式" aria-controls="routeDiagramModal" aria-expanded="false" title="查看支持的文件格式">
    <svg class="fab-icon fab-files-icon" viewBox="0 0 24 24" aria-hidden="true">
      <defs>
        <linearGradient id="filesFabGradient" x1="3" y1="3" x2="21" y2="21" gradientUnits="userSpaceOnUse">
          <stop stop-color="#22d3ee"/>
          <stop offset=".52" stop-color="#3b82f6"/>
          <stop offset="1" stop-color="#8b5cf6"/>
        </linearGradient>
      </defs>
      <path class="fab-files-back" d="M4.2 6.4h8.2l3.1 3.1v10.1H4.2z" stroke="url(#filesFabGradient)" opacity=".42"/>
      <path class="fab-files-main" d="M7.1 3.2h7.2l4.2 4.2v13.4H7.1z" fill="url(#filesFabGradient)" fill-opacity=".1" stroke="url(#filesFabGradient)"/>
      <path d="M14.3 3.2v4.2h4.2M10 12h5.7M10 15.6h4.2" stroke="url(#filesFabGradient)"/>
      <path class="fab-files-spark" d="m19.2 2 .55 1.45L21.2 4l-1.45.55L19.2 6l-.55-1.45L17.2 4l1.45-.55z" fill="#67e8f9" stroke="none"/>
    </svg>
    <span class="sr-only">查看支持的文件格式</span>
  </button>

  <button id="routeDiagramFab" class="route-diagram-fab route-map-fab" type="button" aria-label="查看意图识别流程图" aria-controls="routeDiagramModal" aria-expanded="false" title="查看意图识别流程图">
    <svg class="fab-icon fab-route-icon" viewBox="0 0 24 24" aria-hidden="true">
      <defs>
        <linearGradient id="routeFabGradient" x1="3" y1="4" x2="21" y2="20" gradientUnits="userSpaceOnUse">
          <stop stop-color="#a78bfa"/>
          <stop offset=".48" stop-color="#3b82f6"/>
          <stop offset="1" stop-color="#22d3ee"/>
        </linearGradient>
      </defs>
      <path class="fab-route-orbit" d="M4.1 8.2A8.8 8.8 0 0 1 18.8 5M19.9 15.8A8.8 8.8 0 0 1 5.2 19" stroke="url(#routeFabGradient)" opacity=".5"/>
      <path class="fab-route-track" d="M5.2 6.1h5.5a3 3 0 0 1 3 3v5.6a3 3 0 0 0 3 3h1.7" stroke="url(#routeFabGradient)"/>
      <circle cx="5.2" cy="6.1" r="2.2" fill="#8b5cf6" fill-opacity=".16" stroke="url(#routeFabGradient)"/>
      <circle cx="13.7" cy="12" r="2" fill="#3b82f6" fill-opacity=".18" stroke="url(#routeFabGradient)"/>
      <path class="fab-route-arrow" d="m17.2 15.4 2.8 2.3-2.8 2.3" stroke="url(#routeFabGradient)"/>
      <circle class="fab-route-comet" cx="10.6" cy="6.1" r="1" fill="#67e8f9" stroke="none"/>
    </svg>
    <span class="sr-only">查看意图识别流程</span>
  </button>

  <div id="routeDiagramModal" class="route-diagram-modal" aria-hidden="true">
    <div class="route-diagram-mask" data-route-diagram-close></div>
    <section class="route-diagram-dialog" role="dialog" aria-modal="true" aria-label="页面预览">
      <header class="route-diagram-head">
        <button id="closeRouteDiagramBtn" class="route-diagram-close" type="button" data-route-diagram-close aria-label="关闭页面" title="关闭页面">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg>
        </button>
      </header>
      <div class="route-diagram-frame-wrap">
