name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Check (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node:
          - '20.19.0'
          - '22'
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run project checks
        run: npm run check

  docker-build:
    name: Exact Docker runtime
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Resolve candidate identity
        id: identity
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./scripts/version-source').readVersion()")"
          test -n "$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "source_revision=$(node scripts/runtime-identity.js --source-only)" >> "$GITHUB_OUTPUT"

      - name: Build exact candidate image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          platforms: linux/amd64
          tags: chatui-ci:${{ github.sha }}
          build-args: |
            CHATUI_VERSION=${{ steps.identity.outputs.version }}
            CHATUI_BUILD_SHA=${{ github.sha }}
            CHATUI_SOURCE_REVISION=${{ steps.identity.outputs.source_revision }}
          cache-from: type=gha,scope=chatui-ci
          cache-to: type=gha,scope=chatui-ci,mode=max

      - name: Verify exact container identity and assets
        run: >-
          node scripts/verify-image-runtime.js
          --image chatui-ci:${{ github.sha }}
          --version ${{ steps.identity.outputs.version }}
          --git-sha ${{ github.sha }}
          --source-revision ${{ steps.identity.outputs.source_revision }}
